name: cp-phone-gps-4
components:
  - id: main
    label: 휴대폰 위치
    capabilities:
      - id: buildbook37604.phoneGpsSummary
        version: 1
      - id: refresh
        version: 1
    categories:
      - name: PresenceSensor
  - id: phone1
    label: Phone1
    capabilities:
      - id: buildbook37604.phoneGpsLocation
        version: 1
    categories: []
  - id: phone2
    label: Phone2
    capabilities:
      - id: buildbook37604.phoneGpsLocation
        version: 1
    categories: []
  - id: phone3
    label: Phone3
    capabilities:
      - id: buildbook37604.phoneGpsLocation
        version: 1
    categories: []
  - id: phone4
    label: Phone4
    capabilities:
      - id: buildbook37604.phoneGpsLocation
        version: 1
